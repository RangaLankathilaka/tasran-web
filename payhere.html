<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A0E1A">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Secure payment | TutorMate</title>
    <script src="https://www.payhere.lk/lib/payhere-2.0.js"></script>
    <style>
        :root {
            color-scheme: light;
            --ink: #0A0E1A;
            --muted: #64748B;
            --line: #DCE4EE;
            --cyan: #00AEEF;
            --green: #008F6B;
            --red: #C53030;
            --surface: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: linear-gradient(145deg, #F4F7FB 0%, #E7F8FC 100%);
            font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 460px);
            padding: 36px;
            text-align: center;
            background: var(--surface);
            border: 1px solid rgba(10, 14, 26, 0.08);
            border-radius: 16px;
            box-shadow: 0 20px 55px rgba(10, 14, 26, 0.12);
        }

        .mark {
            width: 180px;
            height: 150px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
        }

        .mark img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 { margin: 0 0 10px; font-size: 1.5rem; }
        p { margin: 0; color: var(--muted); line-height: 1.65; }

        #status {
            margin-top: 22px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        #status.error { color: var(--red); border-color: #F2B8B5; background: #FFF7F7; }
        #status.success { color: var(--green); border-color: #A9DEC9; background: #F4FFFA; }
        .order { margin-top: 14px; color: var(--muted); font-size: 0.8rem; word-break: break-all; }

        @media (max-width: 480px) {
            main { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">
            <img src="tasran-trans.png" alt="TutorMate">
        </div>
        <h1>Secure payment</h1>
        <p id="description">Preparing your payment securely with PayHere.</p>
        <div id="status" role="status" aria-live="polite">Loading payment details...</div>
        <div class="order" id="order"></div>
    </main>

    <script>
        (function () {
            'use strict';

            var API_URL = 'https://api.tasran.com/payhere/payment';
            var NOTIFY_URL = 'https://api.tasran.com/payhere/notify';
            var params = new URLSearchParams(window.location.search);
            var orderId = params.get('order_id');
            var status = document.getElementById('status');
            var description = document.getElementById('description');
            var order = document.getElementById('order');

            function showStatus(message, type) {
                status.textContent = message;
                status.className = type || '';
            }

            function fail(message) {
                description.textContent = 'We could not start this payment.';
                showStatus(message, 'error');
            }

            function startPayment(payment) {
                if (!window.payhere || typeof window.payhere.startPayment !== 'function') {
                    throw new Error('PayHere SDK did not load');
                }

                payment.notify_url = payment.notify_url || NOTIFY_URL;
                showStatus('Opening PayHere...', '');
                window.payhere.startPayment(payment);
            }

            if (!orderId || !/^[A-Za-z0-9._-]{1,100}$/.test(orderId)) {
                fail('A valid order ID is required.');
            } else if (!window.payhere) {
                fail('PayHere is unavailable. Please refresh and try again.');
            } else {
                order.textContent = 'Order: ' + orderId;

                window.payhere.onCompleted = function (completedOrderId) {
                    description.textContent = 'Your payment was submitted successfully.';
                    showStatus('Payment completed. Order: ' + completedOrderId, 'success');
                };

                window.payhere.onDismissed = function () {
                    showStatus('Payment window was closed before completion.', '');
                };

                window.payhere.onError = function (error) {
                    fail('PayHere could not process this payment. Please try again.');
                    console.error('PayHere error:', error);
                };

                fetch(API_URL
                    + '?order_id=' + encodeURIComponent(orderId)
                    + '&platform=web', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    credentials: 'omit',
                    cache: 'no-store'
                })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error('Payment details request failed');
                        }
                        return response.json();
                    })
                    .then(function (body) {
                        if (!body || body.success === false) {
                            throw new Error(body && body.message ? body.message : 'Payment details were rejected');
                        }

                        var payment = body.payment || body;

                        if (!payment || typeof payment !== 'object' || payment.order_id !== orderId) {
                            throw new Error('Payment details did not match the order');
                        }
                        if (!payment.hash || !payment.merchant_id || !payment.amount || !payment.currency) {
                            throw new Error('Payment response is incomplete');
                        }

                        payment.sandbox = params.get('sandbox') === 'true';
                        payment.first_name = params.get('first_name') || '';
                        payment.last_name = params.get('last_name') || '';
                        payment.email = params.get('email') || '';
                        payment.phone = params.get('phone') || '';
                        payment.address = params.get('address') || '';
                        payment.city = params.get('city') || '';
                        payment.country = params.get('country') || '';
                        payment.notify_url = params.get('notify_url') || NOTIFY_URL;
                        payment.custom_1 = params.get('custom_1') || '';
                        payment.custom_2 = params.get('custom_2') || '';
                        payment.return_url = params.get('return_url') || 'https://tasran.com/tutormate';
                        payment.cancel_url = params.get('cancel_url') || 'https://tasran.com/tutormate';

                        startPayment(payment);
                    })
                    .catch(function (error) {
                        console.error('Payment setup error:', error);
                        fail('Payment details are unavailable. Please contact Tasran support.');
                    });
            }
        }());
    </script>
</body>
</html>
